name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout latest code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------
      # 4. Build TypeScript backend
      #
      # Creates:
      #
      # dist/
      # ├── src/
      # │   └── app.js
      # └── package.json
      # --------------------------------------------------
      - name: Build backend
        run: npm run build


      # --------------------------------------------------
      # 5. Configure SSH
      # --------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' > ~/.ssh/github_actions

          chmod 600 ~/.ssh/github_actions

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts


      # --------------------------------------------------
      # 6. Deploy compiled backend
      #
      # dist/ contents go directly into:
      #
      # /var/www/chatboat.orbytrix.com/api/
      #
      # These are NEVER touched:
      #
      # .env.production
      # ecosystem.config.js
      # node_modules
      # package-lock.json
      # public/
      # --------------------------------------------------
      - name: Deploy backend build
        run: |
          rsync -avz --delete \
            --exclude=".env.production" \
            --exclude="ecosystem.config.js" \
            --exclude="node_modules/" \
            --exclude="package-lock.json" \
            --exclude="public/" \
            -e "ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=yes" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/chatboat.orbytrix.com/api/


      # --------------------------------------------------
      # 7. Deploy package-lock.json
      #
      # Required by:
      #
      # npm ci --omit=dev
      # --------------------------------------------------
      - name: Deploy package lock
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=yes" \
            package-lock.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/chatboat.orbytrix.com/api/


      # --------------------------------------------------
      # 8. Install production dependencies
      #    and reload PM2
      #
      # VPS files preserved:
      #
      # public/
      # .env.production
      # ecosystem.config.js
      # --------------------------------------------------
      - name: Install production dependencies and reload PM2
        run: |
          ssh -i ~/.ssh/github_actions \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            cd /var/www/chatboat.orbytrix.com/api

            npm ci --omit=dev

            pm2 reload chatboat-backend-production

          EOF